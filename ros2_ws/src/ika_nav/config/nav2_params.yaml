# Nav2 ayarları: İKA, ika_saha (Faz 3.2b, K-037).
#
# Yalnızca kullanılan düğümler var; değiştirilmeyenler Nav2'nin varsayılanı.
# Dosya yolları (harita, maske) launch/navigation.launch.py'den verilir.
# Araç ölçüleri models/ika_arac/model.sdf'den: palet burnu x +0,79, arka kamera
# x −0,99, gövde y ±0,575 (base_link'e göre).

# ---- Konum: harita + AMCL -----------------------------------------------------

map_server:                        # 3.1'in haritası (ika_saha.pgm) → /map
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map

amcl:                              # parçacık filtresi: lidar taramasını haritaya oturtur
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    tf_broadcast: true             # map → odom'u AMCL yayınlar
    # Başlangıç: araç hep (0, 0)'da doğuya bakarak başlar (K-032). RViz'de
    # "2D Pose Estimate" tıklamak gerekmez
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Odometri gürültüsü: alpha1 dönüşün dönüşe etkisi. 12 tekerlek dönüşte %14
    # fazla sayıyor (K-034); AMCL'ye dönüşte odometriye daha az güvenmesi söylenir
    alpha1: 0.3
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12          # YDLidar X2 (model.sdf)
    laser_max_range: 8.0
    max_beams: 60                  # 720 ışından 60'ı kullanılır: yeterli, hızlı
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25             # 25 cm ya da 0,2 rad hareket etmeden güncelleme yok
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.0

# Keepout maskesi (tools/gen_site.py üretir): kartın reddedeceği yerler
filter_mask_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: /keepout_filter_mask

# ---- Gezinme ------------------------------------------------------------------

bt_navigator:                      # davranış ağacı: planla → sür → takılırsan kurtar
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Ağaç: Nav2'nin hazır navigate_to_pose_w_replanning_and_recovery.xml'i.
    # Liste Humble'ın varsayılan nav2_params.yaml'ından aynen alındı
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

planner_server:                    # global plan: haritada hedefe en ucuz yol
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.0               # hedef kapalıysa yakınına plan yapma: reddet
      use_astar: false
      allow_unknown: true          # haritada görülmemiş (gri) iç köşeler geçilebilir

controller_server:                 # yolu izleyen hız komutları → /cmd_vel_nav → kart
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0     # RULES §3.2 Nav2'nin 20 Hz olduğuna dayanır
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:              # 10 s'de 0,5 m ilerlemezse "takıldı"
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:          # varış toleransı (RULES §5.3: kartınki bundan büyük olmalı)
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25     # ~15°: 12 tekerlek tam açıya oturmaz
    FollowPath:                    # yolun ilerisindeki noktaya yönel, virajda yavaşla
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5      # m/s
      lookahead_dist: 1.0          # araç 1,78 m: bakış mesafesi bir boy kadar
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.5
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.5   # rad/s, yerinde dönüş
      use_rotate_to_heading: true  # yol arkadaysa önce yerinde dön (diferansiyel sürüş)
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      allow_reversing: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true   # engel yakınında yavaşla
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.1
      max_robot_pose_search_dist: 10.0

behavior_server:                   # kurtarma hareketleri: dön, geri git, bekle
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

# ---- Maliyet haritaları (costmap) ---------------------------------------------
# Her hücre: boş, pahalı (engel çevresi, inflation) ya da ölümcül (engel, keepout).
# Keepout maskesi filtre değil katman: Nav2'de filtreler şişirmeden SONRA uygulanır,
# planlayıcı yasak bölgenin dibinden yol çizip gövdeyi taşırıyordu (deneme 2, K-038).

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05             # haritayla aynı
      track_unknown_space: true
      footprint: "[[0.79, 0.575], [0.79, -0.575], [-0.99, -0.575], [-0.99, 0.575]]"
      # İze her yönden 0,3 m pay (K-038): harita ~0,5 m kaymış, AMCL ~0,3 m yanılıyor ve
      # lidar katmanı yok. Pay olmadan planlayıcı konteyner ile kazı arasındaki 1,24 m'lik
      # darboğaza girip gerçek konteynere sürtündü (deneme 2)
      footprint_padding: 0.3
      # İki statik katman (harita, keepout) "büyük olan kalır" kuralıyla birleşir. Humble'da
      # bu costmap düzeyinde bir ayar; katmana yazılınca yok sayılıyor ve keepout haritayı
      # eziyordu (konteyner costmap'ten silinmişti)
      use_maximum: true
      # Lidar katmanı (obstacle_layer) yok (K-038): plan statik harita + keepout ile
      plugins: ["static_layer", "keepout_layer", "inflation_layer"]
      static_layer:                # 3.1'in haritası
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      keepout_layer:               # kartın reddedeceği yerler (tools/gen_site.py); şişirmeden
        plugin: "nav2_costmap_2d::StaticLayer"   # önce: gövde yasak bölgeye taşmaz (K-038)
        map_topic: /keepout_filter_mask
        map_subscribe_transient_local: true
      inflation_layer:             # engel çevresine pahalı şerit
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.5      # iç yarıçaptan (0,575 + 0,3 pay) büyük olmalı, yoksa
                                   # kademeli pahalı şerit oluşmaz
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true         # aracın etrafındaki 8 × 8 m, araçla kayar
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.79, 0.575], [0.79, -0.575], [-0.99, -0.575], [-0.99, 0.575]]"
      # İze her yönden 0,3 m pay (K-038): harita ~0,5 m kaymış, AMCL ~0,3 m yanılıyor ve
      # lidar katmanı yok. Pay olmadan planlayıcı konteyner ile kazı arasındaki 1,24 m'lik
      # darboğaza girip gerçek konteynere sürtündü (deneme 2)
      footprint_padding: 0.3
      # İki statik katman (harita, keepout) "büyük olan kalır" kuralıyla birleşir. Humble'da
      # bu costmap düzeyinde bir ayar; katmana yazılınca yok sayılıyor ve keepout haritayı
      # eziyordu (konteyner costmap'ten silinmişti)
      use_maximum: true
      # Lidar katmanı (obstacle_layer) yok, yakın çevre de statik haritadan (K-038):
      # lidar katmanı olan costmap'in tf tamponu yük altında donuyor (Deney A).
      # Bedeli: haritada olmayan yeni engel görülmez; sahadaki engellerin hepsi sabit
      plugins: ["static_layer", "keepout_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      keepout_layer:               # kartın reddedeceği yerler (tools/gen_site.py); şişirmeden
        plugin: "nav2_costmap_2d::StaticLayer"   # önce: gövde yasak bölgeye taşmaz (K-038)
        map_topic: /keepout_filter_mask
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.5      # iç yarıçaptan (0,575 + 0,3 pay) büyük olmalı, yoksa
                                   # kademeli pahalı şerit oluşmaz
        cost_scaling_factor: 3.0
