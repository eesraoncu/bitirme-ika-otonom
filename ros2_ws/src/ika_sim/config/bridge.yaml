# ROS 2 ↔ Gazebo Fortress köprüsü (K-034). launch/ika_sim.launch.py, ros_gz_bridge'in
# parameter_bridge'ine config_file olarak verir.
#
# Her madde bir konu: ROS'taki adı ve tipi, Gazebo'daki adı ve tipi, yönü.
# GZ_TO_ROS: Gazebo yayınlar, ROS okur (sensörler). ROS_TO_GZ: ROS yayınlar, Gazebo
# okur (hız komutu). Bağlanmayanlar bilerek dışarıda: /camera/points (ağır, RTAB-Map
# derinlik görüntüsünden kendisi üretir), kule kamerası ve kule eklemleri.

# Simülasyon saati: use_sim_time ile çalışan her düğüm buna bakar
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS

# Hız komutu: klavye (teleop_twist_keyboard), ileride Nav2 → kart → araç (K-031)
- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

# Tekerlek odometrisi (DiffDrive): çerçeve odom, çocuk base_link
- ros_topic_name: /odom
  gz_topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

# odom → base_link dönüşümü: DiffDrive bunu /model/ika_arac/tf'e yayınlar, ROS'ta /tf
- ros_topic_name: /tf
  gz_topic_name: /model/ika_arac/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS

# Lidar (YDLidar X2): 720 örnek, 8 m, çerçeve lidar_link
- ros_topic_name: /scan
  gz_topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS

# IMU (BNO055): çerçeve imu_link
- ros_topic_name: /imu
  gz_topic_name: /imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS

# Ön derinlik kamerası (RealSense D456): 640×480, 10 Hz, çerçeve camera_optical_frame
- ros_topic_name: /camera/image
  gz_topic_name: /camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/depth_image
  gz_topic_name: /camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/camera_info
  gz_topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS

# ---- Simülasyonun gerçeği (Faz 5 kaydı, K-054, K-056): yalnız ölçüm için, hiçbir düğüm
#      bunlarla karar vermez (ajan ve kart AMCL'nin konumunu görür)

# Aracın dünyadaki gerçek pozu ve hızı (model.sdf değişiklik 5, OdometryPublisher, 20 Hz)
- ros_topic_name: /sim/odom
  gz_topic_name: /model/ika_arac/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

# Simülasyon hızı: sim saati / gerçek saat (K-055)
- ros_topic_name: /sim/stats
  gz_topic_name: /world/ika_saha/stats
  ros_type_name: ros_gz_interfaces/msg/WorldStatistics
  gz_type_name: ignition.msgs.WorldStatistics
  direction: GZ_TO_ROS

# Gövdenin temas sensörü (model.sdf, 'temas'): yalnız bir şeye değerken yayınlar (çarpışma)
- ros_topic_name: /sim/contact
  gz_topic_name: /world/ika_saha/model/ika_arac/link/base_link/sensor/temas/contact
  ros_type_name: ros_gz_interfaces/msg/Contacts
  gz_type_name: ignition.msgs.Contacts
  direction: GZ_TO_ROS
