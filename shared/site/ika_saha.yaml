# İKA deney sahası: coğrafi sınır ve güvenli noktalar (Faz 3.2, K-037).
#
# Tek kaynak: tools/gen_site.py buradan kartın site_data.c'sini ve Nav2'nin
# yasak bölge maskesini (ros2_ws/src/ika_nav/maps/ika_saha_keepout.*) üretir.
# Başka hiçbir yerde koordinat elle yazılmaz. Değişiklikten sonra:
#     python3 tools/gen_site.py
#
# Koordinatlar dünya = harita çerçevesi (K-032), metre. Bölgeler GERÇEK sınırlar:
# ika_saha.sdf'deki zemin boyaları ve bariyerlerin iç yüzü. Güvenlik payı üreteçte
# uygulanır: izinli alan margin_m kadar içeri çekilir, yasak bölgeler o kadar büyür.
# Çokgenler dışbükey olmalı (pay böyle hesaplanıyor; üreteç denetler).

margin_m: 1.0          # K-036: haritanın dünyaya göre hatası ≤ 0,8 m

allowed:               # bariyerlerin iç yüzü (bariyer çizgisi ± 0,405 m)
  - [-2.595, -9.595]
  - [28.595, -9.595]
  - [28.595, 9.595]
  - [-2.595, 9.595]

forbidden:             # en çok 4 bölge, her biri en çok 8 köşe (RULES §3.1)
  personel: [[3, -8.2], [9, -8.2], [9, -4.5], [3, -4.5]]
  kazi:     [[13, -1.5], [16, -1.5], [16, 1.5], [13, 1.5]]
  yakit:    [[17, -8.2], [23, -8.2], [23, -4.5], [17, -4.5]]

home: [0, 0]           # aracın başlangıcı: (0, 0), doğuya bakar (K-032)

# Kurtarma hedefleri (RULES §5.3). Her biri araç orada her yönde durup dönebilecek kadar açık
# olmalı: Nav2'nin izi + payının dönüş yarıçapı (1,56 m) içinde harita engeli ya da keepout
# yok. Denetim: shared/site/tests/test_safe_points.py. 2026-10-14'te yeniden seçildi: eski
# konteyner_arkasi (8, 7,6) kuzey sınırına, konteyner_onu (8, 2) konteynere değiyordu.
# Noktaya giden YOL denetlenmiyor: guney (13, −5,5) temizdi ama tek girişi personel ile kazı
# köşeleri arasındaki 2,24 m'lik boğaz (paylı); Nav2 orada 4 denemenin 2'sinde takıldı, çıkarıldı.
safe_points:           # sıra önemli: eşitlikte sıra numarası küçük olan seçilir (RULES §5.3)
  baslangic:     [0, 0]
  kuzeybati:     [1.75, 6]
  konteyner_onu: [8.5, 1]
  kapi_onu:      [26, 0]

# Ajanın yer adları (K-044, Faz 4.3): ajan git(yer) ile bunlara ve güvenli noktalara gider.
# Kartın verisi değil (site_data.c'ye girmez). [x, y (m), varış yönü (derece)]. Ölçüt: aracın
# paylı izi bu yönde engele ya da keepout'a değmez (shared/site/tests/test_safe_points.py);
# noktaya giden YOL denetlenmiyor, uçtan uca denenmeli (guney'in dersi).
places:
  konteyner_arkasi: [11, 7, 0]       # iz boşluğu 0,70 m
  kazi_bati:        [9, -0.5, 0]     # 1,91 m
  kazi_dogu:        [20, -0.5, 180]  # 1,91 m
  kazi_kuzeyi:      [15, 5, 180]     # 1,65 m
  yakit_kuzeyi:     [22, -2, 0]      # 0,65 m
